apiVersion: v1
kind: ServiceAccount
metadata:
  name: "$TILLER_SERVICE_ACCOUNT"
  namespace: kube-system
  labels:
    app: helm
    name: tiller
---
apiVersion: rbac.authorization.k8s.io/v1beta1
kind: ClusterRole
metadata:
  name: pasturestack-tiller-compat
  labels:
    app: helm
    name: tiller
rules:
  - apiGroups:
      - "*"
    resources:
      - "*"
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1beta1
kind: ClusterRoleBinding
metadata:
  name: pasturestack-tiller-compat
  labels:
    app: helm
    name: tiller
subjects:
  - kind: ServiceAccount
    name: "$TILLER_SERVICE_ACCOUNT"
    namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pasturestack-tiller-compat
