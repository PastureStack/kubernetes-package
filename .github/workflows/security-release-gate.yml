name: Kubernetes package security gate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kubernetes-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      IMAGE_NAME: pasturestack/kubernetes-package
      TAG: v1.36.4
      TRIVY_VERSION: 0.74.0
      TRIVY_ARCHIVE_SHA256: 2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify clean source and install pinned Trivy
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            --output "$RUNNER_TEMP/trivy.tar.gz" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_ARCHIVE_SHA256}  ${RUNNER_TEMP}/trivy.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/trivy.tar.gz" -C "$RUNNER_TEMP" trivy
          sudo install -m 0555 "$RUNNER_TEMP/trivy" /usr/local/bin/trivy
          trivy --version

      - name: Validate, build, smoke-test, scan, and inventory
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_REVISION="$GITHUB_SHA" IMAGE_NAME="$IMAGE_NAME" TAG="$TAG" bash scripts/ci
          test "$(cat dist/images)" = "${IMAGE_NAME}:${TAG}"

      - name: Upload candidate evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: kubernetes-package-${{ github.run_id }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
          include-hidden-files: false

      - name: Remove the exact run-owned image
        if: always()
        shell: bash
        run: |
          docker image rm -f "${IMAGE_NAME}:${TAG}" >/dev/null 2>&1 || true
